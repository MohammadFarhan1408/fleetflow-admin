name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_APP_ENV: development
      # Validated at build time (src/lib/env.ts). CI runs no fleetflow-api; nothing calls it.
      FLEETFLOW_API_URL: http://127.0.0.1:9

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Design tokens
        run: npm run lint:tokens

      - name: API types match the pinned schema
        run: |
          npm run api:types
          git diff --exit-code -- src/generated

      - name: Unit and component tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E (Chromium, axe)
        run: npm run test:e2e

      - name: Audit
        run: npm audit --audit-level=high

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
